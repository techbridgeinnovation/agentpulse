[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "techbridge-agentpulse"
dynamic = ["version"]
description = "Records what an AI agent spent, from inside the agent's own process, for Agent Pulse."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
# Deliberately none. Everything this library depends on runs inside somebody else's agent.
dependencies = []
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://github.com/techbridgeinnovation/agentpulse"
Source = "https://github.com/techbridgeinnovation/agentpulse/tree/main/python"

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.hatch.version]
path = "src/agentpulse/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/agentpulse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
